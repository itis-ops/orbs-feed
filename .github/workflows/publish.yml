name: publish

on:
  push:
    branches: [main]
    # push trigger fires immediately on every content/queue push (human commits).
    # The publisher bot commits use "[skip ci]" so they don't re-trigger this.
  schedule:
    # Primary cloud scheduler. Runs every 30 min so each slot (8am/5pm/10pm ET)
    # fires within ~30 min regardless of whether a local machine is awake.
    # Safe to run often: publish-due.mjs is idempotent (only posts due+pending,
    # never double-posts) and this repo is public (free Actions minutes).
    # GitHub may skip some scheduled ticks under load; the density covers for it.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, do not publish)"
        type: boolean
        default: false
  repository_dispatch:
    types: [publish]

# allow the job to commit the updated queue.json back to the repo
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node tools/publish-due.mjs --dry-run
          else
            node tools/publish-due.mjs
          fi

      - name: Commit queue state if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "publish: update queue state [skip ci]"
            git push
          else
            echo "No queue changes to commit."
          fi
