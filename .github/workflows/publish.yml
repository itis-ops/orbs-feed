name: publish

on:
  push:
    branches: [main]
    # push trigger fires immediately on every content/queue push (human commits).
    # The publisher bot commits use "[skip ci]" so they don't re-trigger this.
  schedule:
    # Cloud scheduler (backup when Mac launchd is asleep/off).
    # GitHub's */30 cron often only fires ~2-3x/day on free tier, so we also
    # target the three ET posting windows directly (EDT = UTC-4).
    - cron: "*/30 * * * *"
    - cron: "0 12 * * *"    #  8:00am ET
    - cron: "30 12 * * *"   #  8:30am ET
    - cron: "0 21 * * *"    #  5:00pm ET
    - cron: "30 21 * * *"   #  5:30pm ET
    - cron: "0 2 * * *"     # 10:00pm ET (previous calendar evening in ET)
    - cron: "30 2 * * *"    # 10:30pm ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, do not publish)"
        type: boolean
        default: false
  repository_dispatch:
    types: [publish]

# allow the job to commit the updated queue.json back to the repo
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node tools/publish-due.mjs --dry-run
          else
            node tools/publish-due.mjs
          fi

      - name: Commit queue state if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "publish: update queue state [skip ci]"
            git push
          else
            echo "No queue changes to commit."
          fi
