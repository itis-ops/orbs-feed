name: heartbeat

# Second independent scheduler targeting the exact post windows.
# GitHub throttles each workflow's cron separately, so this gives a second
# chance to fire at 8am, 5pm, and 10pm ET when the main cron misses.
# Runs 5 minutes after each target time so the post is definitely due.

on:
  schedule:
    - cron: "5 2 * * *"    # 10:05pm ET (02:05 UTC following day)
    - cron: "5 12 * * *"   # 8:05am ET  (12:05 UTC)
    - cron: "5 21 * * *"   # 5:05pm ET  (21:05 UTC)
  workflow_dispatch:

jobs:
  trigger:
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    permissions:
      contents: write
